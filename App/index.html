<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>股神请就位</title>
  <link rel="icon" href="data:,">
  <!-- iOS 主屏幕：图标 / 名称 / 各机型启动图（splash 由 meta 只认 apple-touch-startup-image） -->
  <link rel="manifest" href="/m/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/m/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="股神请就位">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/m/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/m/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/m/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/m/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/m/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/m/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="/m/splash-2048x2732.png">
  <link rel="stylesheet" href="/m/css/app.css">
</head>
<body>
  <!-- 启动骨架：等首帧 state 之前不要白屏 -->
  <div id="boot" class="boot">
    <div class="boot-logo">股神<span>请就位</span></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-tip" id="bootTip">正在连接交易所…</div>
  </div>

  <!-- 登录 / 开户：全屏演出，登录成功后整体移除 -->
  <div id="login" class="login" hidden>
    <div class="login-glow"></div>
    <div class="login-body" id="loginBody"></div>
  </div>

  <!-- 主壳 -->
  <div id="shell" class="app" hidden>
    <header class="app-header" id="appHeader"></header>
    <main class="app-main" id="appMain"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <!-- 详情页：从底部滑入的二级页（个股 / 排行详情等） -->
  <section class="page" id="page" hidden></section>

  <!-- 全局弹层 -->
  <div class="sheet-mask" id="sheetMask" hidden></div>
  <section class="sheet" id="sheet" hidden></section>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="/lore.js"></script>
  <script src="/m/js/core.js"></script>
  <script src="/m/js/share.js"></script>
  <script src="/m/js/api.js"></script>
  <script src="/m/js/chart.js"></script>
  <script src="/m/js/company.js"></script>
  <script src="/m/js/view-login.js"></script>
  <script src="/m/js/view-market.js"></script>
  <script src="/m/js/view-stock.js"></script>
  <script src="/m/js/conditional.js"></script>
  <script src="/m/js/view-trade.js"></script>
  <script src="/m/js/view-news.js"></script>
  <script src="/m/js/view-rank.js"></script>
  <script src="/m/js/view-me.js"></script>
  <script src="/m/js/main.js"></script>
</body>
</html>
