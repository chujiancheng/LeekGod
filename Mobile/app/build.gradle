plugins {
    id 'com.android.application'
}

// 服务器地址三级来源（**前面的优先**，越靠前越"本机"）：
//   1. server.properties  —— 本机配置文件，.gitignore 不进 git，换机器/换 WiFi 只改这里
//   2. local.properties   —— 本机文件（存 sdk.dir），也允许写 gushenServerUrl
//   3. gradle.properties  —— 入库默认值，给克隆仓库的人兜底
// 值是编译进 APK 的常量，**改完必须重新打包**（跑 build-apk.bat）。
def readLocalUrl = { String name ->
    def f = rootProject.file(name)
    if (!f.exists()) return null
    def p = new Properties()
    f.withInputStream { p.load(it) }
    def v = p.getProperty('gushenServerUrl')
    return v ? v.trim() : null
}
def serverUrl = readLocalUrl('server.properties')
        ?: readLocalUrl('local.properties')
        ?: (project.findProperty('gushenServerUrl') ?: 'http://192.168.1.9:3000')
logger.lifecycle("[gushen] SERVER_URL = ${serverUrl}")

android {
    namespace 'cn.gushen.leekgod'
    compileSdk 33

    defaultConfig {
        applicationId 'cn.gushen.leekgod'
        minSdk 24          // Android 7.0
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
        // 首次启动预填的服务器地址（见上面的三级来源）
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }

    // 纯 WebView 壳，零第三方依赖；签名信息在 keystore.properties（不进 git）
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        ksProps.load(new FileInputStream(ksFile))
        signingConfigs {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }

    // 纯 WebView 壳没有资源/清单可 lint，关掉省一次 lint 依赖解析
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
